services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mineassure
      POSTGRES_PASSWORD: mineassure
      POSTGRES_DB: mineassure
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineassure"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  api:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://mineassure:mineassure@postgres:5432/mineassure
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-mineassure-local-synthetic-demo-only-2026}
      SIGNING_KEY_SECRET: ${SIGNING_KEY_SECRET:-mineassure-local-signing-demo-only-2026}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: ["sh", "-c", "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://mineassure:mineassure@postgres:5432/mineassure
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-mineassure-local-synthetic-demo-only-2026}
      SIGNING_KEY_SECRET: ${SIGNING_KEY_SECRET:-mineassure-local-signing-demo-only-2026}
    command: ["python", "-m", "app.worker"]
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-5173}:5173"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  pgdata:
  miniodata:
